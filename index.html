<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garden Log</title>
  <meta name="theme-color" content="#E7EBE8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#today">Garden Log</a>
    <a class="icon-btn" href="#settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.1 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4.9a8 8 0 0 0-1.9-1.1L15.4 2h-3.9l-.4 2.6c-.7.3-1.3.6-1.9 1.1l-2.4-.9-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-.9c.6.5 1.2.8 1.9 1.1l.4 2.6h3.9l.4-2.6c.7-.3 1.3-.6 1.9-1.1l2.4.9 2-3.4-2-1.6Z"/></svg>
    </a>
  </header>

  <div id="update" class="update" hidden>
    <span>A new version is ready.</span>
    <button type="button" data-act="applyUpdate">Update now</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Today</a>
    <a href="#garden" data-tab="garden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1.6 12H6.6Z"/><path d="M12 9c0-3 1.5-5 4.5-6-.2 3-1.7 5-4.5 6ZM12 9c0-2.2-1.2-3.8-3.6-4.5.1 2.3 1.3 3.8 3.6 4.5Z"/></svg>Garden</a>
    <a href="#journal" data-tab="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1Z"/><path d="M9 8h6M9 12h6"/></svg>Journal</a>
    <a href="#seeds" data-tab="seeds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6Z"/><path d="M12 17c0-3 1.3-5 4-6-.2 2.8-1.5 5-4 6Zm0 0c0-2-1-3.5-3-4 .1 2 1 3.5 3 4Z"/></svg>Seeds</a>
    <a href="#compost" data-tab="compost"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20c0-4 2.5-7 6-7s6 3 6 7"/><path d="M9 9l1.5-3M15 9l-1.5-3M12 8V4"/></svg>Compost</a>
  </nav>

  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
